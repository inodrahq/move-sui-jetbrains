name: Build
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # The IDE distributions used for building and testing need several GB; drop toolchains we never use.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h / | tail -1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install sui
        run: |
          curl -sSfL https://raw.githubusercontent.com/MystenLabs/suiup/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/suiup" install sui@testnet -y
      - name: Warm the Move dependency cache
        # Clones the Sui framework into ~/.move once, outside the test JVM, so tests do not pay for it.
        run: cd src/test/testData/counter-package && sui move build && sui move test --trace --disassemble && rm -rf build traces
      - name: Build and test
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin
          path: build/distributions/*.zip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: build/reports/tests

  verify:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h / | tail -1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify plugin against recommended IDE builds
        run: ./gradlew verifyPlugin --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verifier-report
          path: build/reports/pluginVerifier
