# Manual release: builds, signs and drafts a GitHub release. The `publish` job only runs
# when explicitly requested and requires approval on the `marketplace` environment.
name: Release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to JetBrains Marketplace
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.props.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - id: props
        run: echo "version=$(grep '^pluginVersion' gradle.properties | cut -d= -f2 | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - name: Build, verify and sign
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew build verifyPlugin signPlugin --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: signed-plugin
          path: build/distributions/*-signed.zip
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.props.outputs.version }}" --draft --title "v${{ steps.props.outputs.version }}" \
            --notes "$(./gradlew getChangelog --unreleased --no-header --quiet --no-daemon)" build/distributions/*-signed.zip

  publish:
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin --no-daemon
